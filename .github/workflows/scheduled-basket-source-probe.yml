name: Scheduled basket source probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scheduled-basket-source-probe.yml
  workflow_dispatch:
  schedule:
    - cron: "7 10 * * 1"

permissions:
  contents: read

concurrency:
  group: scheduled-basket-source-probe
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify committed snapshot
        run: make check

      - name: Discover, parse and lock official source bytes once
        run: make basket-source-lock

      - name: Verify exact relocatable source lock
        run: make basket-source-lock-check SOURCE_LOCK=run/source_lock.json

      - name: Summarize source-side maintenance state
        if: always()
        run: |
          {
            echo "## Scheduled basket source probe"
            echo
            echo 'This job performs one exact discovery/download/parse pass and preserves the resulting run/ directory as a relocatable evidence bundle. It avoids probing and then downloading a potentially changed dynamic source again.'
            echo
            echo 'Candidate basket production still requires one exact immutable IPC price release; that cross-repo distribution boundary is intentionally not guessed here.'
            echo
            echo '```text'
            find run artifacts build -maxdepth 4 -type f -printf '%p\n' 2>/dev/null | sort | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact source-lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basket-source-lock-candidate
          path: |
            run/source_lock.json
            run/source_snapshots
            artifacts
            build
          if-no-files-found: warn
          retention-days: 14
