name: Scheduled basket source probe

on:
  workflow_dispatch:
  schedule:
    - cron: "7 10 * * 1"

permissions:
  contents: write  # Existing permission required for immutable prerelease publication
  id-token: write  # Keyless Cloud Logging receipt transport only

concurrency:
  group: scheduled-basket-source-probe
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture exact producer start
        run: echo "PRODUCER_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify committed snapshot and contracts
        id: preflight
        run: |
          make check
          python -m unittest discover -s tests

      - name: Discover, parse and lock official basket source bytes once
        id: source_acquire
        run: make basket-source-lock

      - name: Verify exact relocatable basket source lock
        id: source_lock
        run: make basket-source-lock-check SOURCE_LOCK=run/source_lock.json

      - name: Discover and lock one immutable IPC conversion release
        id: ipc_parent
        run: |
          python -m basket_release.ipc_discovery --output run/ipc_release --lock run/ipc_release_lock.json
          python - <<'PY'
          import os
          from basket_release.ipc_discovery import resolve_locked_release
          release = resolve_locked_release('run/ipc_release_lock.json')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f"IPC_RELEASE={release}\n")
          print(f"Locked IPC release: {release}")
          PY

      - name: Build basket candidate from exact IPC parent
        id: candidate_build
        run: make basket-candidate-v2 SOURCE_LOCK=run/source_lock.json PRICE_RELEASE="$IPC_RELEASE" ALLOW_THIN_PRICE_COVERAGE=1

      - name: Independently validate basket candidate
        id: candidate_qa
        run: |
          release=$(find artifacts/basket_releases -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          test -n "$release"
          make basket-candidate-v2-check RELEASE_DIR="$release"

      - name: Package immutable basket candidate
        id: packaging
        run: |
          release=$(find artifacts/basket_releases -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          test -n "$release"
          make basket-package-v2-candidate RELEASE_DIR="$release"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('build/basket-publication/discovery.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"BASKET_PUBLICATION_TAG={d['github_release']['tag']}\n")
              f.write(f"BASKET_PUBLICATION_ASSET={d['github_release']['asset_name']}\n")
              f.write(f"BASKET_PUBLICATION_RELEASE_ID={d['release_id']}\n")
          PY

      - name: Publish and verify immutable basket prerelease
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="build/basket-publication/$BASKET_PUBLICATION_ASSET"
          discovery="build/basket-publication/discovery.json"
          if ! gh release view "$BASKET_PUBLICATION_TAG" >/dev/null 2>&1; then
            gh release create "$BASKET_PUBLICATION_TAG" "$asset" "$discovery" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$BASKET_PUBLICATION_RELEASE_ID (candidate)" \
              --notes "Immutable candidate transport for research.argentina-regional-baskets/v1. Candidate publication is not scientific approval."
          fi
          # Check even a newly created release, never infer transport from gh exit 0.
          test "$(gh release view "$BASKET_PUBLICATION_TAG" --json isPrerelease --jq .isPrerelease)" = true
          mkdir -p build/existing-basket-release
          gh release download "$BASKET_PUBLICATION_TAG" \
            -p "$BASKET_PUBLICATION_ASSET" -p discovery.json -D build/existing-basket-release
          cmp "$asset" "build/existing-basket-release/$BASKET_PUBLICATION_ASSET"
          cmp "$discovery" build/existing-basket-release/discovery.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder=Path("build/basket-publication")
          d=json.loads((folder/"discovery.json").read_text())
          proof={
            "verification": "byte_equivalent_prerelease",
            "is_prerelease": True,
            "tag": d["github_release"]["tag"],
            "release_id": d["release_id"],
            "asset_sha256": d["github_release"]["asset_sha256"],
            "discovery_sha256": hashlib.sha256((folder/"discovery.json").read_bytes()).hexdigest(),
          }
          (folder/"publication_verified.json").write_text(json.dumps(proof,sort_keys=True)+"\n")
          PY
          echo "Verified published prerelease bytes: $BASKET_PUBLICATION_TAG"

      - name: Emit governed basket producer receipt
        id: basket_receipt
        if: always()
        env:
          PRODUCER_JOB_STATUS: ${{ job.status }}
          PRODUCER_EVENT_NAME: ${{ github.event_name }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          SOURCE_ACQUIRE: ${{ steps.source_acquire.outcome }}
          SOURCE_LOCK: ${{ steps.source_lock.outcome }}
          IPC_PARENT: ${{ steps.ipc_parent.outcome }}
          CANDIDATE_BUILD: ${{ steps.candidate_build.outcome }}
          CANDIDATE_QA: ${{ steps.candidate_qa.outcome }}
          PACKAGING: ${{ steps.packaging.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
        run: |
          python3 scripts/emit_basket_producer_receipt.py \
            --scheduler-run-id "$PRODUCER_RUN_ID" \
            --run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --event-name "$PRODUCER_EVENT_NAME" \
            --job-status "$PRODUCER_JOB_STATUS" \
            --started-at "${PRODUCER_STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            --step-outcomes "$(python3 - <<'PY'
          import json,os
          names=("preflight","source_acquire","source_lock","ipc_parent","candidate_build","candidate_qa","packaging","publication")
          print(json.dumps({n:os.environ[n.upper()] for n in names}))
          PY
          )" \
            --output "build/basket-producer-receipt-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}.json"

      # Credential acquisition and export are independent of basket acceptance.
      - name: Authenticate keyless basket receipt writer
        id: gcp_auth
        if: always() && steps.basket_receipt.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: estate-observability-510700
          workload_identity_provider: projects/456183330588/locations/global/workloadIdentityPools/estate-producer-github/providers/basket-source-main-oidc
          service_account: estate-basket-receipt-writer@estate-observability-510700.iam.gserviceaccount.com

      - name: Export semantic basket receipt
        id: gcp_export
        if: always() && steps.basket_receipt.outcome == 'success' && steps.gcp_auth.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -m pip install 'google-auth>=2.30,<3' 'requests>=2.31,<3'
          python3 scripts/export_basket_producer_gcp.py \
            --receipt "build/basket-producer-receipt-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}.json" \
            --scheduler-run-id "$PRODUCER_RUN_ID" \
            --run-attempt "$PRODUCER_RUN_ATTEMPT" --write

      - name: Report observation transport separately
        if: always()
        env:
          RECEIPT_STATUS: ${{ steps.basket_receipt.outcome }}
          GCP_AUTH_STATUS: ${{ steps.gcp_auth.outcome }}
          GCP_EXPORT_STATUS: ${{ steps.gcp_export.outcome }}
        run: |
          if [[ "$GCP_EXPORT_STATUS" == "success" ]]; then
            echo "Semantic basket receipt exported to Cloud Logging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Receipt transport: source=${RECEIPT_STATUS}, auth=${GCP_AUTH_STATUS}, export=${GCP_EXPORT_STATUS}. Candidate publication is unaffected." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Basket semantic receipt transport incomplete; use source Actions receipt artifact for recovery."
          fi

      - name: Summarize source-side maintenance state
        if: always()
        run: |
          {
            echo "## Scheduled basket source + IPC handoff"
            echo
            echo "Candidate scientific/data publication is separate from canonical producer-run observation and does not constitute scientific approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metadata receipt for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basket-producer-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/basket-producer-receipt-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basket-ipc-handoff-candidate
          path: |
            run/source_lock.json
            run/source_snapshots
            run/ipc_release_lock.json
            run/ipc_release
            artifacts
            build
            build/basket-publication
          if-no-files-found: warn
          retention-days: 14
